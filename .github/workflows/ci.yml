name: ci

on:
  push:
    branches: [development, release]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  configure: beta,  preset: beta,       cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-latest,  configure: beta,  preset: beta,       cc: clang, cxx: clang++ }
          - { name: macos-clang,  os: macos-latest,   configure: alpha, preset: alpha }
          - { name: windows-msvc, os: windows-latest, configure: msvc,  preset: msvc-debug, msvc: true }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select compiler
        if: matrix.cxx
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: linux-gcc-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install gcovr
        run: pipx install gcovr==8.8

      - name: Configure
        run: cmake --preset coverage

      - name: Build, test and write the coverage report
        run: cmake --build --preset coverage-report

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/Linux/coverage/coverage

  quality:
    name: linux-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: Print tool versions
        run: |
          clang-format --version
          clang-tidy --version

      - name: Check formatting
        run: |
          cmake --preset alpha
          cmake --build --preset alpha --target format-check

      - name: Build with clang-tidy
        run: |
          cmake --preset tidy
          cmake --build --preset tidy

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
          ctest --preset sanitize

  container:
    name: linux-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the tests in the test image
        run: docker build --target test -t cpp23-template:test .

      - name: Build the runtime image
        run: docker build --target runtime -t cpp23-template:runtime .

      - name: Smoke test the runtime image
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            cpp23-template:runtime | grep "loaded 2 entries"
          docker run --rm --entrypoint id cpp23-template:runtime | grep "uid=10001"

  hygiene:
    name: linux-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell scripts
        run: shellcheck --shell=sh .husky/pre-commit .husky/commit-msg

      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts
          npx --no -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"

  freebsd:
    name: freebsd-clang
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja git
          run: |
            cmake --preset alpha
            cmake --build --preset alpha
            ctest --preset alpha
