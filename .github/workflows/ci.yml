name: ci

on:
  push:
    branches: [development, release]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-latest,  configure: beta,  preset: beta,       cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-latest,  configure: beta,  preset: beta,       cc: clang, cxx: clang++ }
          - { name: macos-clang,  os: macos-latest,   configure: alpha, preset: alpha }
          - { name: windows-msvc, os: windows-latest, configure: msvc,  preset: msvc-debug, msvc: true }
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        if: matrix.cxx
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: linux-gcc-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr==8.8

      - name: Configure
        run: cmake --preset coverage

      - name: Build, test and write the coverage report
        run: cmake --build --preset coverage-report

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/Linux/coverage/coverage

  quality:
    name: linux-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: Print tool versions
        run: |
          clang-format --version
          clang-tidy --version

      - name: Check formatting
        run: |
          cmake --preset alpha
          cmake --build --preset alpha --target format-check

      - name: Build with clang-tidy
        run: |
          cmake --preset tidy
          cmake --build --preset tidy

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
          ctest --preset sanitize

  freebsd:
    name: freebsd-clang
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake ninja git
          run: |
            cmake --preset alpha
            cmake --build --preset alpha
            ctest --preset alpha
